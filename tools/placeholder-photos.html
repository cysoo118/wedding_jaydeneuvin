<!doctype html>
<!--
  Neutral placeholder images for the photobooth. Each one is labelled with the
  file it stands in for and the shape it should be, so the real photos can be
  dropped into src/assets/photobooth/ under the same names.
  Pick one with the hash: #couple, #booth-1, #booth-2, #booth-3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #000; }
      .ph {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2%;
        box-sizing: border-box;
        color: #6f6a64;
        font-family: 'Cormorant Garamond', Georgia, serif;
        background: radial-gradient(75% 70% at 50% 45%, #e4e1dc 0%, #cfcac4 60%, #b9b3ac 100%);
      }
      /* engraved double keyline */
      .ph::before,
      .ph::after {
        content: '';
        position: absolute;
        border: 2px solid rgba(111, 106, 100, 0.45);
        pointer-events: none;
      }
      .ph::before { inset: 4%; }
      .ph::after { inset: 5.6%; border-width: 1px; }
      .couple { width: 800px; height: 1000px; }
      .couple::before, .couple::after { border-radius: 50%; }
      .booth { width: 800px; height: 590px; }
      svg { width: 22%; height: auto; }
      .label {
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        text-transform: uppercase;
      }
      .couple .label { font-size: 50px; letter-spacing: 0.24em; text-indent: 0.24em; }
      .booth .num { font-size: 210px; line-height: 0.8; font-weight: 500; font-style: italic; }
      .booth .label { font-size: 64px; }
      .file { font-size: 30px; letter-spacing: 0.08em; opacity: 0.8; }
      .couple .file { font-size: 34px; }
    </style>
  </head>
  <body>
    <div id="art"></div>
    <script>
      const scene = location.hash.slice(1) || 'couple';
      const icon = `
        <svg viewBox="0 0 64 52" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
          <rect x="3" y="3" width="58" height="46" rx="4" />
          <circle cx="45" cy="16" r="5" />
          <path d="M5 42 L22 24 L34 35 L41 28 L59 44" />
        </svg>`;
      const art = document.getElementById('art');
      if (scene === 'couple') {
        art.className = 'ph couple';
        art.innerHTML = `${icon}
          <div class="label">Couple photo</div>
          <div class="file">couple.jpg &middot; upright 4 : 5</div>`;
      } else {
        const n = scene.split('-')[1];
        art.className = 'ph booth';
        art.innerHTML = `
          <div class="num">${n}</div>
          <div class="label">Photo</div>
          <div class="file">${scene}.jpg &middot; landscape 4 : 3</div>`;
      }
      document.fonts.ready.then(() => (window.ready = true));
    </script>
  </body>
</html>
