<!doctype html>
<!--
  Placeholder "photographs" for the photobooth (backlit black-and-white couple
  silhouettes). Replace the rendered JPEGs in src/assets/photobooth/ with your
  own pictures — this file only exists so the design has something to show.
  Pick a scene with the hash: #portrait, #booth-1, #booth-2, #booth-3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #000; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
    <script>
      const NS = 'http://www.w3.org/2000/svg';
      const scene = location.hash.slice(1) || 'portrait';
      const W = scene === 'portrait' ? 640 : 720;
      const H = scene === 'portrait' ? 800 : 560;
      const svg = document.getElementById('art');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('width', W);
      svg.setAttribute('height', H);

      function el(tag, attrs, parent = svg) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
      }
      // deterministic randomness so renders are repeatable
      let seed = { portrait: 11, 'booth-1': 23, 'booth-2': 37, 'booth-3': 51 }[scene];
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      const defs = el('defs', {});
      defs.innerHTML = `
        <radialGradient id="glow" cx="50%" cy="42%" r="62%">
          <stop offset="0" stop-color="#f2f2f2"/>
          <stop offset="0.35" stop-color="#9a9a9a"/>
          <stop offset="0.75" stop-color="#3a3a3a"/>
          <stop offset="1" stop-color="#111"/>
        </radialGradient>
        <radialGradient id="vig" cx="50%" cy="50%" r="72%">
          <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
        </radialGradient>
        <linearGradient id="veil" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
        </linearGradient>
        <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
        <filter id="b5"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="soft"><feGaussianBlur stdDeviation="0.8"/></filter>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="linear" slope="0" intercept="0.16"/></feComponentTransfer>
        </filter>`;

      /* -------- light: a soft glow with bokeh -------- */
      el('rect', { width: W, height: H, fill: 'url(#glow)' });
      const bokeh = el('g', { filter: 'url(#b5)' });
      for (let i = 0; i < 46; i++) {
        const r = 8 + rnd() * 34;
        el('circle', {
          cx: rnd() * W, cy: rnd() * H * 0.8,
          r, fill: '#fff', opacity: (0.08 + rnd() * 0.42).toFixed(2),
        }, bokeh);
      }
      const sparkle = el('g', { filter: 'url(#b2)' });
      for (let i = 0; i < 40; i++) {
        el('circle', { cx: rnd() * W, cy: rnd() * H * 0.7, r: 2 + rnd() * 4, fill: '#fff', opacity: (0.3 + rnd() * 0.6).toFixed(2) }, sparkle);
      }

      /* -------- figures -------- */
      // A head-and-shoulders profile facing right, in a ~120 x 260 box.
      const HEAD =
        'M38 168 C38 150 36 138 30 128 C16 116 10 94 12 74 C14 40 40 18 70 18 ' +
        'C92 18 106 32 108 50 C109 58 108 62 110 66 C112 70 118 80 121 86 ' +
        'C122 89 120 91 116 91 C116 94 118 96 117 98 C116 100 118 101 117 103 ' +
        'C116 105 115 106 114 107 C114 110 115 113 113 117 C110 123 103 125 96 125 ' +
        'C88 125 82 128 78 134 C76 145 78 158 80 168 Z';
      const GROOM_BODY =
        'M28 148 C2 160 -66 168 -90 206 L-104 340 L214 340 L200 210 ' +
        'C188 178 128 158 90 148 Z';
      const BRIDE_BODY =
        'M34 150 C22 168 -26 172 -52 202 L-64 340 L184 340 L172 214 ' +
        'C160 184 118 168 88 152 Z';

      function figure(x, y, s, flip, tilt, kind) {
        const g = el('g', {
          transform: `translate(${x} ${y}) scale(${flip ? -s : s} ${s})`,
        });
        const body = el('g', {}, g);
        el('path', { d: kind === 'groom' ? GROOM_BODY : BRIDE_BODY, fill: '#0b0b0b' }, body);
        if (kind === 'groom') {
          // a sliver of light between collar and lapel
          el('path', { d: 'M92 156 L124 214 L110 224 Z', fill: '#262626', filter: 'url(#soft)' }, body);
          el('path', { d: 'M38 26 C58 4 98 6 110 36 C100 26 84 20 68 22 Z', fill: '#0b0b0b' }, g);
        }
        const head = el('g', { transform: `rotate(${tilt} 70 150)` }, g);
        if (kind === 'bride') {
          // veil, lit from behind
          el('path', {
            d: 'M24 30 C-34 40 -84 130 -104 240 C-116 320 -50 340 -10 340 C-16 260 0 160 30 100 Z',
            fill: 'url(#veil)', filter: 'url(#b2)',
          }, head);
          el('ellipse', { cx: 30, cy: 34, rx: 30, ry: 24, fill: '#0b0b0b' }, head); // high chignon
          el('path', { d: 'M100 40 C92 30 80 26 66 28', fill: 'none', stroke: '#0b0b0b', 'stroke-width': 8, 'stroke-linecap': 'round' }, head);
          // a little sparkle on the hair comb
          el('circle', { cx: 18, cy: 18, r: 3, fill: '#fff', filter: 'url(#b2)' }, head);
        }
        el('path', { d: HEAD, fill: '#0b0b0b', filter: 'url(#soft)' }, head);
        // rim light along the face edge
        el('path', {
          d: 'M108 50 C109 58 108 62 110 66 C112 70 118 80 121 86 C122 89 120 91 116 91 C116 94 118 96 117 98 C116 100 118 101 117 103 C116 105 115 106 114 107 C114 110 115 113 113 117 C110 123 103 125 96 125',
          fill: 'none', stroke: '#d9d9d9', 'stroke-width': 1.6, opacity: 0.55, filter: 'url(#soft)',
        }, head);
        return g;
      }

      function umbrella(cx, top, w) {
        const g = el('g', {});
        const h = w * 0.36;
        el('path', {
          d: `M${cx - w / 2} ${top + h} Q${cx} ${top - h * 0.9} ${cx + w / 2} ${top + h}
              Q${cx + w * 0.375} ${top + h * 0.82} ${cx + w * 0.25} ${top + h}
              Q${cx + w * 0.125} ${top + h * 0.82} ${cx} ${top + h}
              Q${cx - w * 0.125} ${top + h * 0.82} ${cx - w * 0.25} ${top + h}
              Q${cx - w * 0.375} ${top + h * 0.82} ${cx - w / 2} ${top + h} Z`,
          fill: '#0b0b0b',
        }, g);
        el('line', { x1: cx, y1: top - h * 0.2, x2: cx, y2: top - h * 0.45, stroke: '#0b0b0b', 'stroke-width': 4 }, g);
        el('path', { d: `M${cx} ${top + h} L${cx} ${top + h * 3.6}`, stroke: '#0b0b0b', 'stroke-width': 5, fill: 'none' }, g);
        // rain
        const rain = el('g', { opacity: 0.5 });
        for (let i = 0; i < 120; i++) {
          const x = rnd() * W, y = rnd() * H, l = 14 + rnd() * 22;
          if (Math.abs(x - cx) < w / 2 && y > top - h && y < top + h * 3) continue;
          el('line', { x1: x, y1: y, x2: x - l * 0.18, y2: y + l, stroke: '#fff', 'stroke-width': 1, opacity: (0.25 + rnd() * 0.5).toFixed(2) }, rain);
        }
        return g;
      }

      // Where a profile feature lands after the head tilt + placement.
      function feature(x, y, s, flip, tilt, px, py) {
        const a = (tilt * Math.PI) / 180;
        const dx = px - 70, dy = py - 150;
        const rx = 70 + dx * Math.cos(a) - dy * Math.sin(a);
        const ry = 150 + dx * Math.sin(a) + dy * Math.cos(a);
        return [x + (flip ? -1 : 1) * s * rx, y + s * ry];
      }
      // Place the groom, then the bride so that her feature (fx, fy) sits at
      // `gap` / `drop` from his — so faces meet exactly where intended.
      function couple(gx, gy, gs, gt, bs, bt, fx, fy, gap, drop) {
        figure(gx, gy, gs, false, gt, 'groom');
        const [hx, hy] = feature(gx, gy, gs, false, gt, fx, fy);
        const [ox, oy] = feature(0, 0, bs, true, bt, fx, fy);
        figure(hx + gap - ox, hy + drop - oy, bs, true, bt, 'bride');
      }
      const NOSE = [121, 86], LIPS = [117, 101];

      if (scene === 'portrait') {
        // noses almost touching, eyes closed in the moment
        couple(96, 250, 1.62, 8, 1.54, -4, ...NOSE, 14, 22);
      } else if (scene === 'booth-1') {
        couple(130, 150, 1.44, 4, 1.38, -2, ...NOSE, 20, 16);
      } else if (scene === 'booth-2') {
        // the kiss
        couple(140, 150, 1.44, 14, 1.38, -10, ...LIPS, -3, 0);
      } else {
        // under one umbrella, as it all began
        umbrella(360, 40, 600);
        couple(170, 232, 1.16, 14, 1.1, -10, ...LIPS, -2, 0);
      }

      /* -------- film finish -------- */
      el('rect', { width: W, height: H, fill: 'url(#vig)' });
      el('rect', { width: W, height: H, filter: 'url(#grain)', fill: '#fff' });
      window.ready = true;
    </script>
  </body>
</html>
